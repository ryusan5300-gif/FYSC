<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYSC - Check Your Sub Count</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/odometer.js/0.4.8/themes/odometer-theme-minimal.min.css" />
    <script>window.odometerOptions={auto:false,format:'(,ddd)',theme:'minimal',duration:1500};</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/odometer.js/0.4.8/odometer.min.js"></script>
    <style>
        :root {
            --blue: #0047AB;
            --gold: #FFD700;
            --silver: #C0C0C0;
            --bronze: #CD7F32;
            --white: #ffffff;
            --gray: #8a9bb5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #010b1f;
            color: var(--white);
            font-family: 'Noto Sans JP', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,71,171,0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,71,171,0.07) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }
        header {
            width: 100%;
            padding: 20px 32px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            border-bottom: 1px solid rgba(0,71,171,0.4);
            position: relative;
        }
        .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3em;
            letter-spacing: 6px;
            color: var(--white);
            line-height: 1;
        }
        .logo span { color: var(--gold); }
        .subtitle {
            font-size: 0.78em;
            color: var(--gray);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Language switcher */
        .lang-bar {
            position: absolute;
            top: 16px;
            right: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: flex-end;
            max-width: 220px;
        }
        .lang-btn {
            background: rgba(0,71,171,0.15);
            border: 1px solid rgba(0,71,171,0.35);
            border-radius: 4px;
            color: var(--gray);
            font-size: 0.72em;
            font-family: inherit;
            padding: 3px 8px;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 0.5px;
        }
        .lang-btn:hover { background: rgba(0,71,171,0.35); color: var(--white); }
        .lang-btn.active { background: var(--blue); color: var(--white); border-color: var(--blue); }

        .main {
            width: 100%;
            max-width: 560px;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }
        .search-wrap { width: 100%; display: flex; flex-direction: column; gap: 10px; }
        .search-label { font-size: 0.78em; color: var(--gray); letter-spacing: 2px; text-transform: uppercase; }
        .search-row { display: flex; gap: 10px; }
        .search-input {
            flex: 1;
            background: rgba(0,71,171,0.15);
            border: 1.5px solid rgba(0,71,171,0.5);
            border-radius: 6px;
            color: var(--white);
            font-family: inherit;
            font-size: 1em;
            padding: 12px 16px;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        .search-input::placeholder { color: rgba(255,255,255,0.3); }
        .search-input:focus { border-color: var(--blue); background: rgba(0,71,171,0.25); }
        .search-btn {
            background: var(--blue);
            border: none;
            border-radius: 6px;
            color: var(--white);
            font-family: inherit;
            font-size: 0.95em;
            font-weight: 700;
            padding: 12px 24px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
            letter-spacing: 1px;
        }
        .search-btn:hover { background: #0057d0; }
        .search-btn:active { transform: scale(0.97); }

        #result { width: 100%; display: none; }
        .result-card {
            background: rgba(0,71,171,0.12);
            border: 1.5px solid rgba(0,71,171,0.45);
            border-radius: 12px;
            overflow: hidden;
        }
        .rank-band {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 24px 16px;
            background: rgba(0,71,171,0.2);
            border-bottom: 1px solid rgba(0,71,171,0.3);
        }
        .rank-inner { text-align: center; }
        .rank-label { font-size: 0.72em; color: var(--gray); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
        .rank-num {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 5em;
            line-height: 1;
            color: var(--white);
        }
        .rank-num.gold   { color: var(--gold);   text-shadow: 0 0 24px rgba(255,215,0,0.45); }
        .rank-num.silver { color: var(--silver);  text-shadow: 0 0 24px rgba(192,192,192,0.45); }
        .rank-num.bronze { color: var(--bronze);  text-shadow: 0 0 24px rgba(205,127,50,0.45); }

            align-items: center;
            gap: 16px;
            padding: 20px 24px;
            border-bottom: 1px solid rgba(0,71,171,0.2);
        }

        .ch-details { flex: 1; min-width: 0; }
        .ch-name {
            font-size: 1.2em;
            font-weight: 900;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 6px;

        .ch-tag { font-size: 0.78em; color: var(--gray); letter-spacing: 0.5px; }

        /* Subs + rate section */
        .subs-section {
            padding: 18px 24px 14px;
            border-bottom: 1px solid rgba(0,71,171,0.2);
        }
        .subs-row {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 10px;
        }
        .subs-label { font-size: 0.72em; color: var(--gray); letter-spacing: 2px; text-transform: uppercase; flex-shrink: 0; }
        .subs-odo { font-size: 2.8em; font-weight: 900; color: var(--white); }

        .rate-row {
            display: flex;
            gap: 24px;
        }
        .rate-item { display: flex; flex-direction: column; gap: 2px; }
        .rate-value { font-size: 1.05em; font-weight: 700; color: #00dd88; }
        .rate-label { font-size: 0.68em; color: var(--gray); letter-spacing: 1.5px; text-transform: uppercase; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: rgba(0,71,171,0.2);
        }
        .stat-cell {
            background: rgba(1,11,31,0.6);
            padding: 14px 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;

        .stat-cell-value { font-size: 1.15em; font-weight: 700; color: var(--white); }
        .stat-cell-value.positive { color: #00dd88; }

        .not-found-msg { font-size: 1em; margin-bottom: 8px; }
        .not-found-hint { font-size: 0.82em; opacity: 0.7; }

        .spinner {
            width: 36px; height: 36px;
            border: 3px solid rgba(0,71,171,0.3);
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }

            text-align: center;

let currentLang = 'en';

function setLang(code) {
    currentLang = code;
    const L = LANGS[code];
    document.getElementById('lbl-subtitle').textContent    = L.subtitle;
    document.getElementById('lbl-search-label').textContent = L.searchLabel;
    document.getElementById('btn-check').textContent       = L.btnCheck;
    document.getElementById('lbl-rank').textContent        = L.rankLabel;
    document.getElementById('lbl-subs').textContent        = L.subsLabel;
    document.getElementById('lbl-per-min').textContent     = L.perMin;
    document.getElementById('lbl-per-hr').textContent      = L.perHr;
    document.getElementById('lbl-pending').textContent     = L.pending;
    document.getElementById('lbl-views').textContent       = L.views;
    document.getElementById('name-input').placeholder      = L.placeholder;
    document.querySelectorAll('.lang-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.lang === code);
    });
    // re-render tag if result visible
    if (document.getElementById('result').style.display !== 'none') {
        renderTag();
    }
}

// Build lang buttons
const langBar = document.getElementById('lang-bar');
Object.entries(LANGS).forEach(([code, L]) => {
    const btn = document.createElement('button');
    btn.className = 'lang-btn' + (code === 'en' ? ' active' : '');
    btn.dataset.lang = code;
    btn.textContent = L.name;
    btn.onclick = () => setLang(code);
    langBar.appendChild(btn);
});

// ── State ─────────────────────────────────────────────
let odo = null;
let odoViews = null;
let currentSubs = 0;
let currentViews = 0;
let lastResult = null; // store last search result for re-render

// growth tracking for per-min / per-hr
let growthHistory = []; // [{time, subs}]

function recordGrowth(subs) {
    const now = Date.now();
    growthHistory.push({ time: now, subs });
    // keep only last 70 minutes
    growthHistory = growthHistory.filter(g => now - g.time < 70 * 60 * 1000);
}

function calcRates(currentSubs, pendingGrowth) {
    const now = Date.now();
    let perMin = 0, perHr = 0;
    // per minute: compare to record closest to 60s ago
    const minAgo = growthHistory.filter(g => now - g.time >= 30000 && now - g.time <= 90000);
    if (minAgo.length > 0) {
        const oldest = minAgo[minAgo.length - 1];
        const elapsed = (now - oldest.time) / 60000; // minutes
        if (elapsed > 0) perMin = Math.round(Math.max(0, currentSubs - oldest.subs) / elapsed);
    }
    // per hour: compare to record closest to 60min ago
    const hrAgo = growthHistory.filter(g => now - g.time >= 30*60000 && now - g.time <= 90*60000);
    if (hrAgo.length > 0) {
        const oldest = hrAgo[hrAgo.length - 1];
        const elapsed = (now - oldest.time) / 3600000; // hours
        if (elapsed > 0) perHr = Math.round(Math.max(0, currentSubs - oldest.subs) / elapsed);
    }
    // fallback: extrapolate from pending growth
    // server tick: each 3s, adds CEIL(growth/1200) subs → per min ≈ growth/1200*20 = growth/60
    if (perMin === 0 && pendingGrowth > 0) {
        perMin = Math.max(1, Math.round(pendingGrowth / 60));
        perHr  = perMin * 60;
    }
    return { perMin, perHr };
}

function initOdoViews() {
    if (odoViews) return;
    const el = document.getElementById('stat-views');
    el.classList.add('odometer');
    odoViews = new Odometer({ el, value: 0, format: '(,ddd)', theme: 'minimal', duration: 1500 });
    odoViews.render();
}

function fmt(n) { return Number(n || 0).toLocaleString(); }

function getRankClass(rank) {
    if (rank === 1) return 'gold';
    if (rank === 2) return 'silver';
    if (rank === 3) return 'bronze';
    return '';
}

function initOdo() {
    if (odo) return;
    const el = document.getElementById('subs-odo');
    odo = new Odometer({ el, value: 0, format: '(,ddd)', theme: 'minimal', duration: 1500 });
    odo.render();
}

function renderTag() {
    if (!lastResult) return;
    const { rank, user, ranking, idx } = lastResult;
    const L = LANGS[currentLang];
    const tagEl = document.getElementById('ch-tag');
    if (rank === 1) {
        tagEl.textContent = L.champion;
    } else {
        const above = ranking[idx - 1];
        const gap = above.subs - user.subs;
        tagEl.textContent = `${fmt(gap)} ${L.gapSuffix} ${L.gapTo}${rank - 1} ${above.name}`;
    }
}


function fmt2(n) { return Number(n||0).toLocaleString(); }

let suggestTimer = null;

async function fetchSuggest(q) {
    if (!q || q.length < 1) { hideSuggest(); return; }
    try {
        const clean = q.startsWith('@') ? q.slice(1) : q;
        const r = await fetch('/api/suggest?q=' + encodeURIComponent(clean));
        const { channels } = await r.json();
        showSuggest(channels);
    } catch(e) { hideSuggest(); }
}

function showSuggest(channels) {
    const list = document.getElementById('suggest-list');
    if (!channels || channels.length === 0) { hideSuggest(); return; }
    const DEF = 'Default_icon.jpg';
    list.innerHTML = channels.map(ch => `
        <div class="suggest-item" onclick="selectSuggest('${ch.name.replace(/'/g, "\\'")}')">
            <img class="suggest-icon" src="${ch.icon || DEF}" onerror="this.src='${DEF}'">
            <span class="suggest-name">${ch.name}</span>
            <span class="suggest-subs">${fmt2(ch.subs)}</span>
        </div>
    `).join('');
    list.style.display = 'block';
}

function hideSuggest() {
    document.getElementById('suggest-list').style.display = 'none';
}

function selectSuggest(name) {
    document.getElementById('name-input').value = name;
    hideSuggest();
    doSearch();
}

async function doSearch() {
    const raw = document.getElementById('name-input').value.trim();
    if (!raw) return;
    const query = raw.startsWith('@') ? raw : '@' + raw;

    document.getElementById('result').style.display = 'none';
    document.getElementById('not-found').style.display = 'none';
    document.getElementById('spinner').style.display = 'flex';

    try {
        const r = await fetch('/api/ranking');
        const { ranking } = await r.json();
        document.getElementById('spinner').style.display = 'none';

        const idx = ranking.findIndex(u =>
            u.name.toLowerCase() === query.toLowerCase() ||
            u.name.toLowerCase() === raw.toLowerCase()
        );

        if (idx === -1) {
            const L = LANGS[currentLang];
            document.getElementById('not-found-msg').textContent = `"${query}" — ${L.notFound}`;
            document.getElementById('not-found-hint').textContent = L.notFoundHint;
            document.getElementById('not-found').style.display = 'block';
            return;
        }

        const user = ranking[idx];
        const rank = idx + 1;
        lastResult = { rank, user, ranking, idx };

        // rank
        const rankEl = document.getElementById('rank-num');
        rankEl.textContent = '#' + rank;
        rankEl.className = 'rank-num ' + getRankClass(rank);

        // icon / name
        document.getElementById('ch-icon').src = (user.icon && user.icon !== '') ? user.icon : 'Default_icon.jpg';
        document.getElementById('ch-name').textContent = user.name;
        renderTag();

        // subs odometer
        initOdo();
        recordGrowth(user.subs);
        if (user.subs !== currentSubs) {
            odo.update(user.subs);
            currentSubs = user.subs;
        }

        // rates
        const { perMin, perHr } = calcRates(user.subs, user.growth || 0);
        document.getElementById('rate-min').textContent = '+' + fmt(perMin);
        document.getElementById('rate-hr').textContent  = '+' + fmt(perHr);

        // stats
        document.getElementById('stat-growth').textContent = '+' + fmt(user.growth || 0);
        // Total Views odometer
        initOdoViews();
        const nv = user.views || 0;
        if (nv !== currentViews) { odoViews.update(nv); currentViews = nv; }

        // show
        const resultEl = document.getElementById('result');
        resultEl.style.display = 'block';
        const card = resultEl.querySelector('.result-card');
        card.classList.remove('fade-in');
        void card.offsetWidth;
        card.classList.add('fade-in');

        // start auto-refresh
        startAutoRefresh(query);

    } catch (e) {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('not-found-msg').textContent = LANGS[currentLang].errMsg;
        document.getElementById('not-found').style.display = 'block';
        console.error(e);
    }
}

// Auto-refresh every 5s after first search
let refreshTimer = null;
let currentQuery = null;

function startAutoRefresh(query) {
    if (currentQuery === query) return;
    currentQuery = query;
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(() => silentRefresh(query), 5000);
}

async function silentRefresh(query) {
    try {
        const r = await fetch('/api/ranking');
        const { ranking } = await r.json();
        const idx = ranking.findIndex(u =>
            u.name.toLowerCase() === query.toLowerCase()
        );
        if (idx === -1) return;
        const user = ranking[idx];
        const rank = idx + 1;
        lastResult = { rank, user, ranking, idx };

        // update rank color
        const rankEl = document.getElementById('rank-num');
        rankEl.textContent = '#' + rank;
        rankEl.className = 'rank-num ' + getRankClass(rank);
        renderTag();

        // subs
        recordGrowth(user.subs);
        initOdo();
        if (user.subs !== currentSubs) {
            odo.update(user.subs);
            currentSubs = user.subs;
        }

        // rates
        const { perMin, perHr } = calcRates(user.subs, user.growth || 0);
        document.getElementById('rate-min').textContent = '+' + fmt(perMin);
        document.getElementById('rate-hr').textContent  = '+' + fmt(perHr);

        document.getElementById('stat-growth').textContent = '+' + fmt(user.growth || 0);
        // Total Views odometer
        initOdoViews();
        const nv = user.views || 0;
        if (nv !== currentViews) { odoViews.update(nv); currentViews = nv; }
    } catch (e) {}
}

document.getElementById('name-input').addEventListener('input', e => {
    clearTimeout(suggestTimer);
    suggestTimer = setTimeout(() => fetchSuggest(e.target.value.trim()), 200);
});
document.getElementById('name-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
});

document.addEventListener('click', e => {
    if (!e.target.closest('.search-wrap')) hideSuggest();
});

// URL param preload
const params = new URLSearchParams(location.search);
const preload = params.get('name');
if (preload) {
    document.getElementById('name-input').value = preload;
    doSearch();
}
</script>
